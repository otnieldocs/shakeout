version: 2
updates:
  # A tool that handles credentials should not drift on its dependencies. The
  # surface is deliberately tiny (one runtime dependency), so this stays quiet.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore'
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'ci'
